appId: com.electron.app
productName: qrcode-scanner
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/@serialport/**
  - node_modules/**/*.node
win:
  executableName: qrcode-scanner
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  artifactName: ${name}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}.${ext}
linux:
  target:
    - deb
  maintainer: zhasno
  category: Utility
  desktop:
    Name: QR Code Scanner
    Comment: Scan QR codes with your camera
    Categories: Utility;Graphics;Photography;
    Keywords: qr;scanner;camera;barcode;
  executableName: qrcode-scanner
deb:
  artifactName: ${name}-${arch}.${ext}
  synopsis: QR Code Scanner
  description: A modern QR code scanner application with auto-update support.
  depends:
    - libgtk-3-0
    - libnss3
npmRebuild: true
publish:
  - provider: github
    owner: zhasno
    repo: qrcode-scanner
    releaseType: release
    publishAutoUpdate: true
